name: Monitor IAR (snapshot diario)

# Corre en GitHub (escritura nativa con GITHUB_TOKEN) cada mañana 10:00 Perú,
# hasta el día de la elección. Determinista: re-deriva el IAR desde el net actual,
# agrega el snapshot del día, regenera el dashboard y lo publica en docs/index.html.
on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 10:00 America/Lima
  workflow_dispatch: {}    # permite ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: iar-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Límite — solo hasta el día de la elección (7-jun-2026)
        run: |
          hoy=$(date -u +%F)
          if [ "$hoy" \> "2026-06-07" ]; then
            echo "La elección (7-jun-2026) ya pasó ($hoy); no se actualiza."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.skip != 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: env.skip != 'true'
        run: pip install -q -r requirements.txt

      - name: Snapshot + regenerar dashboard
        if: env.skip != 'true'
        run: |
          python -m src.agregar_snapshot
          python main.py
          cp informe.html docs/index.html

      - name: Commit y push
        if: env.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "chore(iar): snapshot $(date -u +%F) [skip ci]"
            git push
          fi
